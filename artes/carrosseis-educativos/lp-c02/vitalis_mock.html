<!doctype html><html><head><meta charset="utf-8">
<style>
@import url("file:///C:/Users/Claudia/Herd/dolen-painel/artes/_gerador/fontface.css");
*{box-sizing:border-box;margin:0;padding:0;}
body{width:1600px;height:1000px;overflow:hidden;font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;background:#fff;}
.site{width:1600px;height:1000px;display:flex;flex-direction:column;}

.nav{height:104px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 64px;border-bottom:1px solid #eef1ef;}
.nav .brand{display:flex;align-items:center;gap:14px;}
.nav .brand .ic{width:38px;height:38px;border-radius:50%;background:#2f7d6b;display:flex;align-items:center;justify-content:center;}
.nav .brand .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}
.nav .brand span{font-size:26px;font-weight:700;color:#16302a;letter-spacing:-0.01em;}
.nav .links{display:flex;align-items:center;gap:48px;}
.nav .links a{font-size:18px;font-weight:500;color:#5b6b66;}
.nav .cta{background:#2f7d6b;color:#fff;font-size:17px;font-weight:600;padding:14px 30px;border-radius:100px;}

.hero{flex:1;display:flex;align-items:center;padding:0 64px;gap:70px;background:linear-gradient(180deg,#fbfdfc 0%,#f3f7f5 100%);}
.hero .txt{flex:1;display:flex;flex-direction:column;gap:26px;max-width:620px;}
.hero .kicker{font-size:18px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#2f7d6b;}
.hero h1{font-size:64px;font-weight:700;line-height:1.08;letter-spacing:-0.02em;color:#16302a;}
.hero p{font-size:22px;line-height:1.55;color:#5b6b66;max-width:540px;}
.hero .actions{display:flex;align-items:center;gap:22px;margin-top:10px;}
.hero .btn{display:flex;align-items:center;gap:12px;background:#2f7d6b;color:#fff;font-size:19px;font-weight:600;padding:19px 34px;border-radius:100px;}
.hero .btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;}
.hero .btn2{font-size:19px;font-weight:600;color:#16302a;}

.hero .photo{flex:1;height:640px;border-radius:28px;overflow:hidden;position:relative;box-shadow:0 40px 90px rgba(22,48,42,0.16);}
.hero .photo img{width:100%;height:100%;object-fit:cover;display:block;}
.hero .badge{position:absolute;left:32px;bottom:32px;background:#fff;border-radius:18px;padding:18px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 20px 40px rgba(22,48,42,0.14);}
.hero .badge .dot{width:44px;height:44px;border-radius:50%;background:#eaf3f0;display:flex;align-items:center;justify-content:center;}
.hero .badge .dot svg{width:22px;height:22px;stroke:#2f7d6b;fill:none;stroke-width:2;}
.hero .badge .lb{font-size:15px;font-weight:600;color:#5b6b66;}
.hero .badge .vl{font-size:19px;font-weight:700;color:#16302a;}
</style></head>
<body>
<div class="site">
  <nav class="nav">
    <div class="brand">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-9C.8 8.1 2.3 4.5 6 4.5c2 0 3.3 1.1 4 2.1.7-1 2-2.1 4-2.1 3.7 0 5.2 3.6 3.5 7.5C19 16.65 12 21 12 21z"/></svg></span>
      <span>Vitalis Saúde</span>
    </div>
    <div class="links">
      <a>Início</a><a>Especialidades</a><a>Equipe</a><a>Contato</a>
    </div>
    <div class="cta">Agendar consulta</div>
  </nav>
  <div class="hero">
    <div class="txt">
      <span class="kicker">Clínica de saúde</span>
      <h1>Cuidado que<br/>você pode confiar.</h1>
      <p>Atendimento humanizado, hora marcada e sem fila de espera — especialidades, equipe e localização num só lugar.</p>
      <div class="actions">
        <div class="btn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Agendar pelo WhatsApp</div>
        <div class="btn2">Ver especialidades →</div>
      </div>
    </div>
    <div class="photo">
      <img src="file:///C:/Users/Claudia/Herd/dolen-painel/artes/carrosseis-educativos/lp-c02/fotos/hero_clinica.jpg"/>
      <div class="badge">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span>
        <div><div class="lb">Atendimento</div><div class="vl">Hora marcada</div></div>
      </div>
    </div>
  </div>
</div>
</body></html>
