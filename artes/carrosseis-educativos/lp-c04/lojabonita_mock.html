<!doctype html><html><head><meta charset="utf-8">
<style>
@import url("file:///C:/Users/Claudia/Herd/dolen-painel/artes/_gerador/fontface.css");
*{box-sizing:border-box;margin:0;padding:0;}
body{width:1600px;height:1180px;overflow:hidden;font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif;background:#fff;}
.site{width:1600px;height:1180px;display:flex;flex-direction:column;}

.nav{height:100px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 64px;border-bottom:1px solid #eee;}
.nav .brand{font-size:28px;font-weight:700;color:#1a1a1a;letter-spacing:-0.01em;}
.nav .links{display:flex;align-items:center;gap:44px;}
.nav .links a{font-size:18px;font-weight:500;color:#6a6a6a;}
.nav .right{display:flex;align-items:center;gap:26px;}
.nav .cart{position:relative;width:26px;height:26px;}
.nav .cart svg{width:26px;height:26px;stroke:#1a1a1a;fill:none;stroke-width:1.8;}
.nav .cart .badge{position:absolute;top:-8px;right:-10px;background:#c9704f;color:#fff;font-size:12px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.banner{position:relative;height:420px;flex:none;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.72);}
.banner .txt{position:absolute;left:64px;bottom:52px;color:#fff;}
.banner .txt .kicker{font-size:16px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;opacity:0.85;}
.banner .txt h1{font-size:48px;font-weight:700;margin-top:12px;letter-spacing:-0.01em;}
.banner .btn{display:inline-block;margin-top:22px;background:#fff;color:#1a1a1a;font-size:17px;font-weight:600;padding:15px 30px;border-radius:100px;}

.grid{flex:1;display:flex;gap:28px;padding:40px 64px;background:#fafafa;}
.card{flex:1;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,0.06);}
.card .sw{height:280px;display:flex;align-items:center;justify-content:center;}
.card .info{padding:20px 22px;}
.card .nm{font-size:19px;font-weight:700;color:#1a1a1a;}
.card .pr{font-size:18px;font-weight:600;color:#c9704f;margin-top:6px;}
.card .add{margin-top:14px;display:inline-block;font-size:14px;font-weight:600;color:#1a1a1a;border:1.5px solid #1a1a1a;border-radius:100px;padding:9px 20px;}
</style></head>
<body>
<div class="site">
  <nav class="nav">
    <span class="brand">Loja Bonita</span>
    <div class="links"><a>Novidades</a><a>Vestidos</a><a>Acessórios</a><a>Sale</a></div>
    <div class="right">
      <span class="cart"><svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4 2H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span class="badge">3</span></span>
    </div>
  </nav>
  <div class="banner">
    <img src="file:///C:/Users/Claudia/Herd/dolen-painel/artes/carrosseis-educativos/lp-c01/fotos/final_moda.jpg"/>
    <div class="txt">
      <span class="kicker">Nova coleção</span>
      <h1>Peças que vestem sua história.</h1>
      <span class="btn">Ver tudo</span>
    </div>
  </div>
  <div class="grid">
    <div class="card"><div class="sw" style="background:#e7ddd2;"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#b8a68d" stroke-width="1.3"><path d="M6 4h12l2 4-8 3-8-3z"/><path d="M8 8v12h8V8"/></svg></div><div class="info"><div class="nm">Vestido Linho</div><div class="pr">R$ 189,90</div><div class="add">Adicionar</div></div></div>
    <div class="card"><div class="sw" style="background:#d9cdbf;"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#a8927a" stroke-width="1.3"><path d="M4 8l4-4h8l4 4-3 2v10H7V10z"/></svg></div><div class="info"><div class="nm">Blazer Alfaiataria</div><div class="pr">R$ 259,90</div><div class="add">Adicionar</div></div></div>
    <div class="card"><div class="sw" style="background:#ece3da;"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#b8a68d" stroke-width="1.3"><path d="M8 4h8l2 16H6z"/><path d="M9 4a3 3 0 0 0 6 0"/></svg></div><div class="info"><div class="nm">Calça Wide Leg</div><div class="pr">R$ 149,90</div><div class="add">Adicionar</div></div></div>
  </div>
</div>
</body></html>
