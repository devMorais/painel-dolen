@if (configuracoes(); as c) {
  <main class="links-main">
    <div class="links-card">
      <header class="links-head">
        <img src="/assets/images/dolen-icone-preto-96.png" alt="" width="48" height="48" />
        <span class="links-nome">{{ c.nome_site }}</span>
        <p class="links-tagline">{{ c.tagline }}</p>
      </header>

      <nav class="links-lista">
        <a routerLink="/orcamento" class="link-row">
          <span class="link-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round" />
            </svg>
          </span>
          <span class="link-label">Pedir orçamento</span>
          <span class="link-seta" aria-hidden="true">›</span>
        </a>

        <a routerLink="/" fragment="precos" class="link-row">
          <span class="link-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9" />
              <path d="M9.5 15.2c.4.7 1.2 1.1 2.2 1.1 1.4 0 2.5-.8 2.5-2 0-1.1-.9-1.6-2.3-2-1.4-.4-2.2-.9-2.2-2 0-1.2 1.1-2 2.4-2 1 0 1.8.4 2.2 1.1M12 7v1.2M12 15.8V17" stroke-linecap="round" />
            </svg>
          </span>
          <span class="link-label">Ver planos e preços</span>
          <span class="link-seta" aria-hidden="true">›</span>
        </a>

        @if (c.whatsapp_numero; as whatsapp) {
          <a [href]="linkWhatsApp(whatsapp)" target="_blank" rel="noopener" class="link-row link-destaque">
            <span class="link-icone link-icone-whatsapp" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="currentColor">
                <path d="M16.004 3C9.06 3 3.43 8.63 3.43 15.573c0 2.348.65 4.542 1.78 6.42L3 29l7.18-2.164a12.53 12.53 0 0 0 5.824 1.44h.005c6.943 0 12.573-5.63 12.573-12.573C28.582 8.76 22.947 3 16.004 3Zm0 22.86h-.004a10.42 10.42 0 0 1-5.31-1.454l-.38-.226-3.945 1.19 1.207-3.848-.248-.395a10.41 10.41 0 0 1-1.595-5.554c0-5.76 4.688-10.447 10.45-10.447 2.792 0 5.416 1.09 7.39 3.064a10.375 10.375 0 0 1 3.06 7.39c0 5.76-4.688 10.28-10.625 10.28Zm5.723-7.71c-.313-.157-1.85-.913-2.137-1.017-.287-.104-.496-.157-.705.157s-.808 1.017-.99 1.226c-.183.208-.365.235-.678.078-.313-.157-1.322-.487-2.518-1.552-.93-.83-1.559-1.854-1.741-2.167-.183-.313-.02-.482.137-.638.14-.14.313-.365.47-.548.157-.183.209-.313.313-.522.104-.208.052-.391-.026-.548-.078-.157-.705-1.7-.966-2.328-.254-.61-.512-.527-.705-.537l-.6-.01c-.208 0-.548.078-.834.391-.287.313-1.096 1.07-1.096 2.61 0 1.54 1.122 3.028 1.278 3.237.157.208 2.21 3.375 5.354 4.732.748.323 1.33.516 1.785.66.75.239 1.433.205 1.973.124.602-.09 1.85-.756 2.11-1.487.26-.73.26-1.356.183-1.487-.078-.13-.287-.208-.6-.365Z" />
              </svg>
            </span>
            <span class="link-label">Falar pelo WhatsApp</span>
            <span class="link-seta" aria-hidden="true">›</span>
          </a>
        }
      </nav>

      @if (c.instagram_url; as instagram) {
        <div class="links-social">
          <a [href]="instagram" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17" cy="7" r="0.8" fill="currentColor" stroke="none" />
            </svg>
          </a>
        </div>
      }

      <a href="https://www.dolen.com.br" class="btn-acessar">Acesse o site</a>

      <footer class="links-rodape">{{ c.copyright_texto }}</footer>
    </div>
  </main>
}
